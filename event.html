<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive Event | Canadian Immigration Rule Change Archive</title><meta name="description" content="Citation-ready event record from the MAK Canadian Immigration Rule Change Archive."><meta name="robots" content="index,follow"><style>:root{--ink:#14263d;--muted:#66788b;--line:#dce5eb;--paper:#f7fafb;--brand:#0a626b;--old:#7a4752}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);line-height:1.6}header{padding:44px 22px 28px;background:#f2f8f8;border-bottom:1px solid var(--line)}main{max-width:960px;margin:auto;padding:28px 22px 70px}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.06;margin:.2em 0}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--brand)}.muted{color:var(--muted)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{font-size:.75rem;font-weight:800;padding:4px 8px;border-radius:999px;background:#eef5f5;color:var(--brand)}.pill.old{background:#f7eeee;color:var(--old)}.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;background:white}.card.alt{background:var(--paper)}a{color:var(--brand);font-weight:700}code,.cite{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.cite{border-left:4px solid var(--brand);background:var(--paper);padding:14px 16px;overflow-wrap:anywhere}.sources li{margin:.45em 0}.error{padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}</style></head><body><header><div style="max-width:960px;margin:auto"><div class="eyebrow">MAK Immigration Data Observatory · Event record</div><h1 id="title">Loading archive event…</h1><p id="sub" class="muted"></p></div></header><main><p><a href="citation-table.html">← Citation table</a> · <a href="index.html">Archive home</a> · <a href="cite-reuse.html">Cite & reuse</a></p><div id="out"></div></main><script>
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p=new URLSearchParams(location.search), id=p.get('id');
function render(e,version){document.title=`${e.topic} | Canadian Immigration Rule Change Archive`;document.getElementById('title').textContent=e.topic;document.getElementById('sub').textContent=`Event ${e.id} · verified ${e.last_verified_at}`;const statusOld=String(e.status).includes('superseded');const permalink=`https://makimmigration.github.io/mak-immigration-rule-archive/event.html?id=${encodeURIComponent(e.id)}`;const citation=`MAK Canadian Immigration Services, Immigration Data Observatory. “${e.topic},” Canadian Immigration Rule Change Archive, v${version}, event ${e.id}. ${permalink} Controlling official source: ${e.controlling_source_url}`;document.getElementById('out').innerHTML=`<div class="meta"><span class="pill">${esc(e.jurisdiction)}</span><span class="pill">${esc(e.change_type)}</span><span class="pill ${statusOld?'old':''}">${esc(e.status)}</span></div><div class="card alt"><strong>Date treatment</strong><p>Announcement: ${esc(e.announcement_date||'not separately recorded')}<br>Observed from: ${esc(e.rule_observed_from)}<br>Effective from: ${esc(e.effective_from||'not separately established')}<br>Effective to: ${esc(e.effective_to||'not separately established')}</p><p class="muted">${esc(e.date_basis)}</p></div><div class="card"><h2>Rule/change recorded</h2><p>${esc(e.new_rule)}</p></div><div class="card"><h2>Transition / historical context</h2><p>${esc(e.transition_rule)}</p></div><div class="card"><h2>Previous rule / coverage</h2><p>${esc(e.previous_rule)}</p>${e.supersedes_event_id?`<p>Supersedes: <a href="event.html?id=${encodeURIComponent(e.supersedes_event_id)}"><code>${esc(e.supersedes_event_id)}</code></a></p>`:''}${e.superseded_by_event_id?`<p>Superseded by: <a href="event.html?id=${encodeURIComponent(e.superseded_by_event_id)}"><code>${esc(e.superseded_by_event_id)}</code></a></p>`:''}</div><div class="card"><h2>Official sources</h2><ul class="sources"><li><a target="_blank" rel="noopener" href="${esc(e.controlling_source_url)}">Controlling official source</a></li>${(e.supporting_source_urls||[]).map((u,i)=>`<li><a target="_blank" rel="noopener" href="${esc(u)}">Official supporting source ${i+1}</a></li>`).join('')}</ul></div><div class="card"><h2>Citation-ready reference</h2><div class="cite">${esc(citation)}</div><p class="muted">Cite the controlling official source for the underlying rule or policy. Current official government sources control if they conflict with this archive.</p></div><div class="card alt"><strong>Evidence control</strong><p>${esc(e.evidence_status)} · last verified ${esc(e.last_verified_at)}</p><p>Stable event ID: <code>${esc(e.id)}</code><br>Permalink: <a href="${esc(permalink)}">${esc(permalink)}</a></p></div>`;}
if(!id){document.getElementById('title').textContent='Event ID required';document.getElementById('out').innerHTML='<div class="error">Open this page from the citation table or add <code>?id=EVENT_ID</code> to the URL.</div>';}else{fetch('events.json').then(r=>r.json()).then(j=>{const e=(j.events||[]).find(x=>x.id===id);if(!e)throw new Error('not found');render(e,j.archive?.version||'0.8.0')}).catch(()=>{document.getElementById('title').textContent='Archive event not found';document.getElementById('out').innerHTML='<div class="error">No published archive event matches that ID.</div>'});}
</script></body></html>
